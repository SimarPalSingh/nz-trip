<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NZ Trip">
  <title>Aotearoa Odyssey 🇳🇿 | Simar & Sheen's South Island Road Trip</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css?v=5">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230284c7'/%3E%3Cstop offset='50%25' stop-color='%2314b8a6'/%3E%3Cstop offset='100%25' stop-color='%230f172a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='128' fill='url(%23g)'/%3E%3Cpath d='M120 370 L256 160 L392 370 Z' fill='none' stroke='%23ffffff' stroke-width='28' stroke-linejoin='round'/%3E%3Cpath d='M200 370 L280 240 L350 370 Z' fill='%235eead4' opacity='0.7'/%3E%3Ccircle cx='380' cy='140' r='36' fill='%23fbbf24'/%3E%3Cpath d='M256 160 L230 205 L256 220 L282 205 Z' fill='%23ffffff'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Ambient Atmospheric Glow -->
  <div class="ambient-glow"></div>

  <!-- Main Header & Hero Section -->
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-badge">
        <div class="brand-icon-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M14 6l-3.8 5.7a1 1 0 0 0 .8 1.5h1.5l-2.7 4.1a1 1 0 0 0 .8 1.5h4.6a1 1 0 0 0 .9-.6l4.2-8.4a1 1 0 0 0-.9-1.4h-1.6l1.3-2.1a1 1 0 0 0-.9-1.3H14z" />
            <path d="M4 18h4.5l2-3H8.3a1 1 0 0 1-.8-.5L5.7 12H3a1 1 0 0 0-.9 1.4l1.9 4.6z" opacity="0.6" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Aotearoa Odyssey</h1>
          <div class="brand-subtitle">Simar & Sheen • 29 Sep – 11 Oct</div>
        </div>
      </div>
      <div class="quick-stats-pill" id="quickTripProgress">
        <strong>13 Days</strong> • South Island
      </div>
    </div>

    <!-- Live Trip Countdown -->
    <div class="hero-countdown-box">
      <div class="countdown-label-row">
        <span>🚗 Road Trip Departure Countdown</span>
        <span class="countdown-dest-badge">Christchurch 3:00 PM</span>
      </div>
      <div id="tripCountdown">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- Global Instant Search -->
    <div class="search-bar-wrap">
      <span class="search-icon-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="globalSearch" placeholder="Search stops, salmon, gondola, pies, hotels..." class="search-input" autocomplete="off">
      <button id="clearSearchBtn" class="btn-clear-search" title="Clear search">✕</button>
    </div>

    <!-- Desktop Navigation Tabs -->
    <nav class="nav-pills-bar" aria-label="Main Navigation">
      <button class="nav-tab-btn active" data-tab="timeline">
        <span>🗺️ Daily Timeline</span>
      </button>
      <button class="nav-tab-btn" data-tab="copilot">
        <span>✨ AI Co-Pilot</span>
      </button>
      <button class="nav-tab-btn" data-tab="stays">
        <span>🏨 Accommodations</span>
      </button>
      <button class="nav-tab-btn" data-tab="car">
        <span>🚗 Car & Coach</span>
      </button>
      <button class="nav-tab-btn" data-tab="checklist">
        <span>🎒 Packing & Gear</span>
      </button>
      <button class="nav-tab-btn" data-tab="overview">
        <span>📊 Budget & Setup</span>
      </button>
    </nav>
  </header>

  <!-- Horizontal Scrollable Day Selector (Visible on Timeline View) -->
  <section class="day-pills-section" id="dayPillsSection">
    <div class="day-pills-scroll" id="dayPillsContainer">
      <!-- Injected via app.js -->
    </div>
  </section>

  <!-- Dynamic Main Content Area -->
  <main class="main-content" id="mainViewContainer">
    <!-- Rendered via app.js -->
  </main>

  <!-- Sticky Bottom Navigation for Mobile (One-Thumb Access) -->
  <nav class="bottom-mobile-nav" aria-label="Mobile Navigation">
    <button class="mobile-nav-item active" data-tab="timeline">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Itinerary</span>
    </button>
    <button class="mobile-nav-item" data-tab="copilot">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Co-Pilot</span>
    </button>
    <button class="mobile-nav-item" data-tab="stays">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Stays</span>
    </button>
    <button class="mobile-nav-item" data-tab="car">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      <span>Car</span>
    </button>
    <button class="mobile-nav-item" data-tab="checklist">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Packing</span>
    </button>
    <button class="mobile-nav-item" data-tab="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>Setup</span>
    </button>
  </nav>

  <!-- Application Logic -->
  <script src="./app.js?v=5"></script>
</body>
</html>
